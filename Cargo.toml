[package]
name = "elliptical-pen-envelope"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/baptiste/premetadated"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
typst-plugin = ["dep:wasm-minimal-protocol"]

[dependencies]
bincode = "1.3"
i_overlay = "4"
larnt = { git = "https://github.com/HellOwhatAs/larnt.git", rev = "c871b00f" }
parry3d-f64 = "0.31"
serde = { version = "1", features = ["derive"] }
wasm-minimal-protocol = { version = "0.1", optional = true }

[dev-dependencies]
approx = "0.5"